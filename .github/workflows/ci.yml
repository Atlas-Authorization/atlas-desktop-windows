name: ci

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
            echo "OPENSSL_HINT=" >> "$GITHUB_ENV"
          else
            brew install openssl@3 ninja
            echo "OPENSSL_HINT=-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
      - name: Configure (portable core only)
        run: cmake -S . -B build -G Ninja -DATLAS_BUILD_PROVIDER=OFF -DCMAKE_BUILD_TYPE=Release $OPENSSL_HINT
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows (msvc x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Prepare cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure (vcpkg manifest)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-msvc-x64
      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-x64
      - name: Test
        shell: pwsh
        run: ctest --preset windows-msvc-x64 --output-on-failure --timeout 120
      - name: Real-CNG tests (ECDH byte order, sealed bundle through CNG)
        shell: pwsh
        run: ctest --preset windows-msvc-x64 -R CngEcdh --output-on-failure -V
      - name: Provider GUIDs and WebAuthn platform check (log)
        shell: pwsh
        run: ctest --preset windows-msvc-x64 -R "WindowsProviders|WindowsWebAuthn" --output-on-failure -V
      - name: Command-line MFA smoke (service in a console, real named pipe)
        shell: pwsh
        run: |
          $bin = (Resolve-Path build/windows-msvc-x64/src/provider/Release).Path
          $svc = Start-Process "$bin\atlas-cli-mfa.exe" -ArgumentList serve -PassThru -WindowStyle Hidden
          Start-Sleep 3
          # No config: stock behaviour, allowed.
          & "$bin\atlas-cli-mfa.exe" check --service ci
          if ($LASTEXITCODE -ne 0) { throw "expected allow without a config, got $LASTEXITCODE" }
          # ssh-wrap runs the client's command after the factor and passes its exit code on.
          $env:SSH_ORIGINAL_COMMAND = 'exit 7'
          & "$bin\atlas-cli-mfa.exe" ssh-wrap
          if ($LASTEXITCODE -ne 7) { throw "ssh-wrap should return the command's exit code, got $LASTEXITCODE" }
          # Enrolled config whose device key is missing: broken install, refused, and the command must NOT run.
          $dir = Join-Path $env:ProgramData 'Atlas'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'config.json') -Value '{"instance_url":"https://auth.example.com","publishable_key":"pk","instance_id":"ins_1","device_id":"ddv_x","device_key_id":"missing-key","enrolled":true}'
          $ran = Join-Path $env:TEMP 'atlas-ran.txt'
          Remove-Item $ran -ErrorAction SilentlyContinue
          $env:SSH_ORIGINAL_COMMAND = 'echo x > "%TEMP%\atlas-ran.txt"'
          & "$bin\atlas-cli-mfa.exe" ssh-wrap
          if ($LASTEXITCODE -ne 1) { throw "a broken install must refuse (1), got $LASTEXITCODE" }
          if (Test-Path $ran) { throw "the command ran although the factor was refused" }
          # Service gone: fail closed.
          Stop-Process -Id $svc.Id -Force
          Start-Sleep 1
          & "$bin\atlas-cli-mfa.exe" check
          if ($LASTEXITCODE -ne 2) { throw "no service must refuse (2), got $LASTEXITCODE" }
          Remove-Item (Join-Path $dir 'config.json') -Force

      - name: Installer and scripts (WiX build, task XML, PowerShell parse, module import)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          $bin = (Resolve-Path build/windows-msvc-x64/src/provider/Release).Path
          wix build installer/Package.wxs -arch x64 -d Version=0.2.0 -d "BinDir=$bin" -o build/AtlasLoginAgent-ci.msi
          if ($LASTEXITCODE) { throw "wix build failed" }
          foreach ($f in Get-ChildItem installer -Include *.ps1,*.psm1 -Recurse) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $e | Out-Host; throw "PowerShell parse error in $($f.Name)" }
          }
          Import-Module ./installer/AtlasMfa/AtlasMfa.psd1 -Force
          if ((Get-Command -Module AtlasMfa).Count -ne 2) { throw "AtlasMfa should export two commands" }
          Get-Content browser-extension/manifest.json -Raw | ConvertFrom-Json | Out-Null
          foreach ($t in 'logon', 'refresh') {
            schtasks /Create /TN "AtlasCiCheck\$t" /XML "installer/atlas-sso-$t-task.xml" /F
            if ($LASTEXITCODE) { throw "task XML for $t was rejected by Task Scheduler" }
            schtasks /Delete /TN "AtlasCiCheck\$t" /F | Out-Null
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/windows-msvc-x64/src/provider/Release/*.dll
            build/windows-msvc-x64/src/provider/Release/*.exe

  release:
    name: release (msi)
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      SIGN_PFX_B64: ${{ secrets.ATLAS_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.ATLAS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Prepare cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.5
      - name: Locate signtool
        shell: pwsh
        run: |
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Add-Content $env:GITHUB_PATH (Split-Path $st.FullName)
      - name: Prepare signing material (only if the secrets exist)
        shell: pwsh
        run: |
          if ($env:SIGN_PFX_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "atlas-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
            Add-Content $env:GITHUB_ENV "ATLAS_SIGN_PFX=$pfx"
            Add-Content $env:GITHUB_ENV "ATLAS_SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD"
            Write-Host "Signing enabled"
          } else {
            Write-Host "No signing secrets: the MSI will be built unsigned"
          }
      - name: Build MSI
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./installer/build.ps1 -Version $version
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: if ($env:ATLAS_SIGN_PFX) { Remove-Item -Force $env:ATLAS_SIGN_PFX -ErrorAction SilentlyContinue }
      - uses: softprops/action-gh-release@v2
        with:
          files: build/installer/*.msi
